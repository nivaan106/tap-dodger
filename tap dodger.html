<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Tap Dodger</title>

<style>
  body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
    touch-action: none;
  }

  canvas {
    display: block;
    margin: auto;
    background: #222;
  }

  #ui {
    position: fixed;
    top: 10px;
    left: 10px;
    font-size: 18px;
  }

  #restart {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    padding: 12px 20px;
    font-size: 18px;
    border: none;
    border-radius: 8px;
    background: #00c853;
    color: black;
    display: none;
  }
</style>
</head>

<body>
<div id="ui">Score: 0</div>
<button id="restart">Restart</button>
<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

let player, blocks, score, gameOver;

function resetGame() {
  player = {
    x: canvas.width / 2,
    y: canvas.height - 80,
    size: 40,
    speed: 8
  };

  blocks = [];
  score = 0;
  gameOver = false;
  document.getElementById("restart").style.display = "none";
}

resetGame();

function spawnBlock() {
  blocks.push({
    x: Math.random() * (canvas.width - 40),
    y: -40,
    size: 40,
    speed: 4 + score * 0.02
  });
}

let spawnTimer = 0;

function update() {
  if (gameOver) return;

  spawnTimer++;
  if (spawnTimer > 40) {
    spawnBlock();
    spawnTimer = 0;
  }

  blocks.forEach(b => b.y += b.speed);

  blocks = blocks.filter(b => b.y < canvas.height + 50);

  blocks.forEach(b => {
    if (
      b.x < player.x + player.size &&
      b.x + b.size > player.x &&
      b.y < player.y + player.size &&
      b.y + b.size > player.y
    ) {
      gameOver = true;
      document.getElementById("restart").style.display = "block";
    }
  });

  score++;
  document.getElementById("ui").textContent = "Score: " + score;
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = "#00e5ff";
  ctx.fillRect(player.x, player.y, player.size, player.size);

  ctx.fillStyle = "#ff5252";
  blocks.forEach(b => {
    ctx.fillRect(b.x, b.y, b.size, b.size);
  });

  if (gameOver) {
    ctx.fillStyle = "white";
    ctx.font = "40px Arial";
    ctx.textAlign = "center";
    ctx.fillText("Game Over", canvas.width / 2, canvas.height / 2);
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();

/* CONTROLS */

// Touch (mobile)
canvas.addEventListener("touchstart", e => {
  const x = e.touches[0].clientX;
  player.x = x - player.size / 2;
});

// Mouse (PC)
canvas.addEventListener("mousemove", e => {
  player.x = e.clientX - player.size / 2;
});

// Restart
document.getElementById("restart").onclick = resetGame;
</script>
</body>
</html>
